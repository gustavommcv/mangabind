name: Release

on:
  push:
    tags:
      - "v*"

# Nothing is published unless the same checks that guard `main` pass on the
# commit the tag points to, and that commit is on `main`.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  vulnerabilities:
    uses: ./.github/workflows/govulncheck.yml

  goreleaser:
    needs: [ci, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
