version: "2"

linters:
  settings:
    errcheck:
      # Deferred/cleanup Close() calls are consistently the lowest-value
      # thing errcheck flags here - the one Close() that actually matters
      # for a correct .cbz (zip.Writer.Close, which writes the central
      # directory) is already checked explicitly in internal/cbz/cbz.go.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*archive/zip.Writer).Close
        - (*archive/zip.ReadCloser).Close
